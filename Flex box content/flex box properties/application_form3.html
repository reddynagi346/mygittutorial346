<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application_form_3</title>
    <link rel="stylesheet" href="application_form3.css">
</head>
<body>
    <div class="cons">
        <div>Name<br>
            <input type="text">
        </div>
        <div>Which taxi do you require?<br>
            <div>
                <input type="radio" name="" id="qts">
                <label for="qts">Car</label><br/>
                <input type="radio" name="" id="qt">
                <label for="qt">Van</label><br/>
                <input type="radio" name="" id="q">
                <label for="q">Tuk tuk</label>
            </div>
        </div>
        <div>Phone<input type="text"></div>
        
        <div>Extras
            <div>
                <input type="checkbox" name="" id="rad">
                <label for="rad">Baby seat</label><br/>
                <input type="checkbox" name="" id="ra">
                <label for="ra">Wheelchair Access</label><br/>
                <input type="checkbox" name="" id="r">
                <label for="r">Stock Tip</label>
            </div>
        </div>
        <div>Pickup Date/Time 
            <input type="datetime-local" name="" id="">
        </div>
        <div>Drop place<br/>
            <input type="text">
        </div>
        <div>Pickup Place<br/>
            <select style="width:90%;">
                <option value="">Select one</option>
                <option value="">Nandyal</option>
                <option value="">Panyam</option>
                <option value="">Rgm college</option>
                <option value="">Noonepalli</option>
                <option value="">Atmakur</option>
                <option value="">Mahanadhi</option>
                <option value="">Velugodu</option>
                <option value="">Nandyal</option>
            </select>
        </div>
        <div class="child">Special Instructions<br/>
            <textarea name="" id="" style="width:100%; height:80%;"></textarea>
        </div>
        <div class="child1">
            <input type="button" value="Submit Booking">
        </div>
    </div>
</body>
</html>
